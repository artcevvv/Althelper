name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release from main'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build Linux Binary & AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            libgl1-mesa-dev \
            xorg-dev \
            librsvg2-bin \
            file \
            wget

      - name: Render App Icon
        run: |
          rsvg-convert -w 256 -h 256 assets/althelper.svg -o assets/althelper.png

      - name: Build Standalone Binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -v -ldflags="-s -w" -o dist/althelper .

      - name: Package Standalone Tarball
        run: |
          mkdir -p dist/package
          cp dist/althelper dist/package/althelper
          cp README.md dist/package/
          cp assets/althelper.desktop dist/package/
          cp assets/althelper.png dist/package/
          tar -czf dist/althelper-linux-amd64.tar.gz -C dist/package .
          cp dist/althelper dist/althelper-linux-amd64

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/althelper AppDir/usr/bin/althelper
          cp assets/althelper.desktop AppDir/althelper.desktop
          cp assets/althelper.desktop AppDir/usr/share/applications/althelper.desktop
          cp assets/althelper.png AppDir/althelper.png
          cp assets/althelper.png AppDir/.DirIcon
          cp assets/althelper.png AppDir/usr/share/icons/hicolor/256x256/apps/althelper.png

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/althelper" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir dist/AltHelper-x86_64.AppImage

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum althelper-linux-amd64 althelper-linux-amd64.tar.gz AltHelper-x86_64.AppImage > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: althelper-linux
          path: |
            dist/althelper-linux-amd64
            dist/althelper-linux-amd64.tar.gz
            dist/AltHelper-x86_64.AppImage
            dist/checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/althelper-linux-amd64
            dist/althelper-linux-amd64.tar.gz
            dist/AltHelper-x86_64.AppImage
            dist/checksums.txt
          generate_release_notes: true
